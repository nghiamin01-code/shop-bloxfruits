<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Identity Analysis v2.0</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            text-align: center; 
            background: #0f0c29; 
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            color: #ffffff;
            margin: 0; 
            padding: 20px 10px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .container { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 25px 15px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 500px; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h1 { font-size: 20px; color: #4facfe; letter-spacing: 1px; margin-bottom: 15px; }
        p { color: #ccc; font-size: 14px; line-height: 1.5; }

        .welcome-img, #troll-image { 
            width: 100%; 
            max-width: 350px;
            border-radius: 12px; 
            margin: 15px auto;
            display: block;
            border: 2px solid #4facfe;
        }

        #troll-image { border: 4px solid #ff4b2b; box-shadow: 0 0 20px #ff4b2b; }

        .btn-group { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-top: 20px; 
        }

        button { 
            padding: 15px 20px; 
            cursor: pointer; 
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: bold; 
            text-transform: uppercase;
            transition: 0.3s;
            width: 100%;
        }
        
        button:active { transform: scale(0.95); }

        .scanning-text {
            font-family: monospace;
            color: #00f2fe;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .warning { 
            color: #ff4b2b; 
            font-weight: bold; 
            margin-top: 15px; 
            font-size: 13px; 
            background: rgba(255, 75, 43, 0.1);
            padding: 12px; 
            border-radius: 8px; 
            border-left: 4px solid #ff4b2b;
            display: none;
        }

        #result-area { display: none; width: 100%; }

        /* Tối ưu cho màn hình nhỏ hơn */
        @media (max-width: 380px) {
            h1 { font-size: 18px; }
            button { padding: 12px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <!-- TRANG CHÀO MỪNG -->
    <div id="welcome-screen">
        <h1>AI IDENTITY ANALYSIS</h1>
        <p>Hệ thống AI sẽ quét sinh trắc học để tìm đối tượng tương thích DNA với bạn.</p>
        <img src="https://i.postimg.cc/Y9Q5p4Kw/889e0ff6-b8e2-44f5-a6ea-5d96b874e98e.jpg" class="welcome-img">
        <button onclick="startQuiz()">Bắt đầu quét ✨</button>
    </div>

    <!-- KHU VỰC CÂU HỎI -->
    <div id="quiz-box" style="display: none;">
        <div class="scanning-text" id="status-text">STATUS: CHỜ LỆNH...</div>
        <h2 id="question" style="font-size: 18px; margin-bottom: 20px;">Bước 1: Bạn thường xử lý thông tin dựa trên cơ sở nào?</h2>
        <div class="btn-group" id="btn-container">
            <button onclick="nextStep()">Dữ liệu Logic</button>
            <button onclick="nextStep()">Phán đoán Trực giác</button>
        </div>
    </div>

    <!-- KẾT QUẢ TROLL -->
    <div id="result-area">
        <h1 style="color: #ff4b2b;">MATCH FOUND! (99.9%)</h1>
        <p style="color: #fff;">Đối tượng khớp lệnh DNA cao nhất:</p>
        <img src="https://i.postimg.cc/qqhpXJWx/Gemini-Generated-Image-i8flxmi8flxmi8fl.png" id="troll-image">
        <div class="warning" id="lock-msg">ĐANG ĐỒNG BỘ DỮ LIỆU CLOUD... (60s)</div>
        <p id="final-troll" style="display:none; font-size: 18px; font-weight: bold; color: #ff4b2b; margin-top: 10px;">
            ĐẸP ĐÔI QUÁ, KHỎI CHỐI! 😂🤡
        </p>
    </div>
</div>

<script>
    let step = 1;
    let timeLeft = 60;

    function startQuiz() {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('status-text').innerText = "STATUS: ĐANG TRUY XUẤT...";
    }

    function nextStep() {
        const qElem = document.getElementById('question');
        const statusElem = document.getElementById('status-text');
        const btnContainer = document.getElementById('btn-container');
        
        if (step === 1) {
            statusElem.innerText = "STATUS: ĐANG QUÉT TẦN SỐ...";
            qElem.innerText = "Bước 2: Bạn ưu tiên giá trị nào trong cuộc sống?";
            btnContainer.innerHTML = `
                <button onclick="nextStep()">Sự ổn định thực tế</button>
                <button onclick="nextStep()">Sáng tạo đột phá</button>
            `;
            step++;
        } else if (step === 2) {
            statusElem.innerText = "STATUS: KHỚP LỆNH DỮ LIỆU...";
            qElem.innerText = "Bước cuối: Bạn đã sẵn sàng xem kết quả phân tích AI chưa?";
            btnContainer.innerHTML = `
                <button onclick="nextStep()">Xác nhận truy xuất</button>
            `;
            step++;
        } else {
            startTroll();
        }
    }

    function startTroll() {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('lock-msg').style.display = 'block';

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                document.getElementById('lock-msg').innerText = `HỆ THỐNG ĐANG KHÓA ĐỂ ĐỒNG BỘ (${timeLeft}s)`;
            } else {
                clearInterval(timer);
                document.getElementById('lock-msg').style.background = "#00f2fe";
                document.getElementById('lock-msg').style.color = "#000";
                document.getElementById('lock-msg').innerText = "XONG! GIỜ THÌ THOÁT ĐI ĐỒ NGỐC 😂";
                document.getElementById('final-troll').style.display = 'block';
            }
        }, 1000);
    }

    // Chặn Back nút trên điện thoại
    history.pushState(null, null, location.href);
    window.onpopstate = function () { history.go(1); };
</script>

</body>
</html>
